<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Should I put the heating on?</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e0322b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preload" href="land.json" as="fetch" crossorigin>
<style>
:root{
  --sea:#d7e4ec; --land:#f3f4ef; --coast:#b9c8d2; --ink:#1c2b36; --muted:#5d6d78;
  --hot:#e0322b; --cold:#2f6fdb; --hot-glow:rgba(224,50,43,.28); --off:#8d9ba5; --panel:#ffffff; --line:#dfe5e9;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sea:#0f1b24; --land:#1e2c36; --coast:#2d4150; --ink:#eef2f4; --muted:#9fb0bb; --off:#6e7f8a; --panel:#17232c; --line:#2a3a46; --hot-glow:rgba(255,70,60,.35); }
}
:root[data-theme="dark"]{ --sea:#0f1b24; --land:#1e2c36; --coast:#2d4150; --ink:#eef2f4; --muted:#9fb0bb; --off:#6e7f8a; --panel:#17232c; --line:#2a3a46; --hot-glow:rgba(255,70,60,.35); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--body)}

.answer{position:absolute;z-index:500;left:16px;top:calc(16px + env(safe-area-inset-top,0px));max-width:360px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;box-shadow:0 10px 30px -18px rgba(20,40,60,.5)}
.answer h1{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 2px;color:var(--muted);letter-spacing:.01em}
.verdict{font-family:var(--display);font-weight:800;font-size:clamp(44px,11vw,64px);line-height:.95;margin:0;letter-spacing:-.02em}
.verdict.yes{color:var(--hot)}
.why{margin:10px 0 0;font-size:15px;color:var(--ink);max-width:34ch}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:14px 0 6px;background:var(--cold)}
.meter span{background:var(--hot)}
.meta{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
label.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}

.sheet{position:absolute;z-index:600;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 32px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 10px 30px -18px rgba(20,40,60,.5);display:none}
.sheet.open{display:block}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px;line-height:1.1}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.close{position:absolute;right:12px;top:12px;border:none;font-size:22px;line-height:1;padding:6px 10px}
.outside{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.outside b{font-family:var(--display);font-size:36px;font-weight:800}
.outside span{color:var(--muted);font-size:14px}
.home{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.home:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cold)}
.dot.on{background:var(--hot);box-shadow:0 0 0 4px var(--hot-glow)}
.home .state{font-weight:700}
.home .temps{grid-column:2/4;font-size:14px;color:var(--muted)}
.home .src{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.sheet h3{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.sheet p,.sheet li{font-size:14px}
.sheet ol{padding-left:20px;margin:6px 0}
code{font-size:13px;background:var(--line);padding:1px 5px;border-radius:5px}
.note{font-size:13px;color:var(--muted)}
.sheet a{color:var(--ink)}
.note a{color:var(--muted)}

.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:transparent!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.4);opacity:0}}
.dotm i{position:absolute;inset:0;border-radius:50%}
.dotm.merged i{box-shadow:0 0 0 2px var(--panel)}
.dotm i.ring{animation:pulse 2.6s ease-out infinite;box-shadow:none}
.dotm b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 12px/1 var(--body);text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.dotm i.ring{animation:none;display:none}}
.place{position:relative;width:0;height:0;pointer-events:none}
/* Small neutral dot on the town itself, centred on the marker's anchor. */
.place i{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 1.5px var(--panel)}
.place.major i{left:-3px;top:-3px;width:6px;height:6px}
.place span{position:absolute;color:var(--muted);font:600 11px/1 var(--body);white-space:nowrap;text-shadow:0 1px 2px var(--panel),0 -1px 2px var(--panel),1px 0 2px var(--panel),-1px 0 2px var(--panel)}
.place.major span{color:var(--ink);font-size:12px}
.place .r{left:6px;top:0;transform:translateY(-50%)}
.place .l{right:6px;top:0;transform:translateY(-50%)}
.place .a{left:0;bottom:5px;transform:translateX(-50%)}
.place .b{left:0;top:5px;transform:translateX(-50%)}
.legend{display:grid;grid-template-columns:auto auto;gap:4px 24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted);min-width:140px}
.lg-bar{grid-column:1/3;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--hot))}
.lg-r{text-align:right}

@media (max-width:720px){
  .legend{margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}
  .answer{left:10px;right:10px;max-width:none;padding:14px 16px}
  .why{max-width:none}
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom,0px)}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of homes reporting heating status"></div>

<section class="answer" aria-live="polite">
  <h1>Should I put the heating on?</h1>
  <p class="verdict" id="verdict">…</p>
  <p class="why" id="why"></p>
  <div class="meter" aria-hidden="true"><span id="bar" style="width:0"></span></div>
  <p class="meta" id="meta"></p>
  <div class="row">
    <button class="primary" id="connectBtn">Share my heating</button>
    <label class="tog"><input type="checkbox" id="showOff" checked> Show homes with heating off</label>
  </div>
</section>

<aside class="sheet" id="sheet" aria-live="polite">
  <button class="close" id="closeSheet" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API = '';            // same origin; set to 'https://…' if the page is hosted elsewhere
const REFRESH_MS = 60000;

// Only used to label areas ("Near Leeds"). No home locations here.
const TOWNS = [["London",51.51,-0.12],["Birmingham",52.48,-1.89],["Manchester",53.48,-2.24],["Leeds",53.8,-1.55],["Glasgow",55.86,-4.25],
  ["Edinburgh",55.95,-3.19],["Bristol",51.45,-2.59],["Liverpool",53.41,-2.98],["Newcastle",54.98,-1.61],["Sheffield",53.38,-1.47],
  ["Cardiff",51.48,-3.18],["Belfast",54.6,-5.93],["Nottingham",52.95,-1.15],["Southampton",50.9,-1.4],["Brighton",50.82,-0.14],
  ["Norwich",52.63,1.3],["Exeter",50.72,-3.53],["Plymouth",50.38,-4.14],["Aberdeen",57.15,-2.09],["Inverness",57.48,-4.22],
  ["York",53.96,-1.08],["Cambridge",52.2,0.12],["Oxford",51.75,-1.26],["Swansea",51.62,-3.94],["Dundee",56.46,-2.97],
  ["Hull",53.74,-0.33],["Leicester",52.64,-1.13],["Carlisle",54.89,-2.93],["Truro",50.26,-5.05],["Dublin",53.35,-6.26],
  ["Cork",51.9,-8.47],["Galway",53.27,-9.05],["Stirling",56.12,-3.94],["Lincoln",53.23,-0.54],["Ipswich",52.06,1.15],
  ["Reading",51.45,-0.97],["Coventry",52.41,-1.51],["Stoke-on-Trent",53.0,-2.18],["Derby",52.92,-1.48],["Portsmouth",50.8,-1.09],
  ["Bournemouth",50.72,-1.88],["Milton Keynes",52.04,-0.76],["Northampton",52.24,-0.9],["Peterborough",52.57,-0.24],["Preston",53.76,-2.7],
  ["Blackpool",53.81,-3.05],["Middlesbrough",54.57,-1.23],["Sunderland",54.9,-1.38],["Gloucester",51.86,-2.24],["Worcester",52.19,-2.22],
  ["Shrewsbury",52.71,-2.75],["Wrexham",53.05,-3.0],["Bangor",53.23,-4.13],["Aberystwyth",52.41,-4.08],["Canterbury",51.28,1.08],
  ["Colchester",51.89,0.9],["Chelmsford",51.74,0.47],["Luton",51.88,-0.42],["Salisbury",51.07,-1.79],["Taunton",51.02,-3.1],
  ["Perth",56.4,-3.43],["Fort William",56.82,-5.1],["Dumfries",55.07,-3.61],["Derry",55.0,-7.32],["Limerick",52.66,-8.63],["Waterford",52.26,-7.11]];
function nearestTown(lat, lon) {
  let best = null, bestD = Infinity;
  for (const [n, a, o] of TOWNS) {
    const d = Math.hypot(lat - a, (lon - o) * Math.cos(lat * Math.PI / 180));
    if (d < bestD) { bestD = d; best = n; }
  }
  return bestD < 0.35 ? 'Near ' + best : 'This area';
}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = v => v == null ? '–' : v + '°';
const SOURCE = { home_assistant: 'Home Assistant', hive: 'Hive', other: 'Other' };

// ---------- Map ----------
const map = L.map('map', { zoomSnap: .25, minZoom: 5, maxZoom: 11, maxBoundsViscosity: 1 });
map.attributionControl.setPrefix(false).addAttribution('Outlines: Natural Earth');
map.zoomControl.setPosition('bottomright');
map.setMaxBounds([[47.5, -13.5], [61.5, 4]]);   // keep the view on the British Isles
const css = () => getComputedStyle(document.documentElement);
// Natural Earth 1:10m outlines of the British Isles (England, Scotland, Wales, Northern Ireland,
// Ireland, Isle of Man, Channel Islands), loaded separately so the page itself stays small.
const landLayer = L.geoJSON(null, { interactive: false, style: () => ({ color: css().getPropertyValue('--coast').trim(), weight: 1, fillColor: css().getPropertyValue('--land').trim(), fillOpacity: 1 }) }).addTo(map);
fetch('land.json').then(r => r.json()).then(d => landLayer.addData(d)).catch(() => {});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () =>
  landLayer.setStyle({ color: css().getPropertyValue('--coast').trim(), fillColor: css().getPropertyValue('--land').trim() }));

// ---------- Place names ----------
const MAJOR_TOWNS = new Set(['London', 'Birmingham', 'Manchester', 'Leeds', 'Glasgow', 'Edinburgh',
  'Bristol', 'Liverpool', 'Newcastle', 'Sheffield', 'Cardiff', 'Belfast', 'Dublin']);
// Own pane below the marker pane, so heating dots always sit on top of place names.
map.createPane('places').style.zIndex = 450;
const labelLayer = L.layerGroup().addTo(map);
function redrawLabels() {
  labelLayer.clearLayers();
  const z = map.getZoom(), taken = [];
  const overlaps = r => taken.some(t => r[0] < t[2] && t[0] < r[2] && r[1] < t[3] && t[1] < r[3]);
  const dotBox = p => [p.x - 3, p.y - 3, p.x + 3, p.y + 3];
  // Big towns first (TOWNS is ordered by size). Their dots are reserved up front so no name covers them;
  // a smaller town whose dot would sit under a bigger town's name is left off.
  const shown = TOWNS.filter(([name]) => z >= 7.5 || MAJOR_TOWNS.has(name))
    .map(([name, lat, lon]) => ({ name, lat, lon, major: MAJOR_TOWNS.has(name), p: map.latLngToLayerPoint([lat, lon]) }))
    .sort((a, b) => b.major - a.major);
  for (const t of shown) if (t.major) taken.push(dotBox(t.p));
  for (const { name, lat, lon, major, p } of shown) {
    if (!major) {
      if (overlaps(dotBox(p))) continue;
      taken.push(dotBox(p));
    }
    // Try the name to the right of the dot, then left, above and below; drop it if none fit.
    const w = name.length * (major ? 7 : 6.3) + 2, { x, y } = p;
    const spots = { r: [x + 4, y - 8, x + 6 + w, y + 8], l: [x - 6 - w, y - 8, x - 4, y + 8],
                    a: [x - w / 2, y - 20, x + w / 2, y - 4], b: [x - w / 2, y + 4, x + w / 2, y + 20] };
    const side = Object.keys(spots).find(k => !overlaps(spots[k]));
    if (side) taken.push(spots[side]);
    const icon = L.divIcon({ className: 'place' + (major ? ' major' : ''), iconSize: [0, 0],
      html: '<i></i>' + (side ? `<span class="${side}">${esc(name)}</span>` : '') });
    labelLayer.addLayer(L.marker([lat, lon], { icon, pane: 'places', interactive: false, keyboard: false }));
  }
}
map.on('zoomend', redrawLabels);

function frame() {
  const a = document.querySelector('.answer').getBoundingClientRect();
  map.fitBounds([[50.0,-10.3],[58.6,1.8]], innerWidth < 720
    ? { paddingTopLeft: [8, a.bottom + 4], paddingBottomRight: [8, 8] }
    : { paddingTopLeft: [a.right + 10, 20], paddingBottomRight: [20, 20] });
}
frame();
redrawLabels();

// ---------- Dots, with merging when they overlap ----------
// Colour runs from blue (every home off) to red (every home on).
const COLD = [47, 111, 219], HOT = [224, 50, 43];
const mix = f => 'rgb(' + COLD.map((c, i) => Math.round(c + (HOT[i] - c) * f)).join(',') + ')';
const dotSize = homes => Math.round(Math.min(12 + Math.sqrt(homes) * 4, 56));

const dotLayer = L.layerGroup().addTo(map);
const showOff = document.getElementById('showOff');
let CELLS = [];   // [{lat, lon, n, on, name, ref}]
let onCellClick = () => {};

function mergeGroups(a, b) {
  const n = a.n + b.n;
  return { members: a.members.concat(b.members), n, on: a.on + b.on,
    p: L.point((a.p.x * a.n + b.p.x * b.n) / n, (a.p.y * a.n + b.p.y * b.n) / n), r: dotSize(n) / 2 };
}
function cluster(points) {
  let groups = points.map(c => ({ members: [c], n: c.n, on: c.on, p: map.latLngToLayerPoint([c.lat, c.lon]), r: dotSize(c.n) / 2 }));
  let merged = true;
  while (merged) {                       // keep merging until nothing overlaps
    merged = false;
    groups.sort((a, b) => b.n - a.n);
    for (let i = 0; i < groups.length && !merged; i++) {
      for (let j = i + 1; j < groups.length; j++) {
        if (groups[i].p.distanceTo(groups[j].p) < (groups[i].r + groups[j].r) * 0.9) {
          groups[i] = mergeGroups(groups[i], groups[j]);
          groups.splice(j, 1);
          merged = true; break;
        }
      }
    }
  }
  return groups;
}
function viewPad() {   // the part of the map not covered by the headline panel
  const a = document.querySelector('.answer').getBoundingClientRect();
  return innerWidth < 720 ? { tl: L.point(16, a.bottom + 16), br: L.point(16, 60) }
                          : { tl: L.point(a.right + 16, 24), br: L.point(24, 24) };
}
function zoomInto(g) {
  const b = L.latLngBounds(g.members.map(c => [c.lat, c.lon])), pad = viewPad();
  const z = Math.min(Math.max(map.getBoundsZoom(b.pad(0.3), false, pad.tl.add(pad.br)), map.getZoom() + 1.5), map.getMaxZoom());
  // Put the group in the middle of the uncovered area, not the middle of the screen.
  const shift = pad.tl.subtract(pad.br).divideBy(2);
  map.flyTo(map.unproject(map.project(b.getCenter(), z).subtract(shift), z), z, { duration: 0.5 });
}
function redraw() {
  dotLayer.clearLayers();
  const visible = CELLS.filter(c => showOff.checked || c.on > 0);
  for (const g of cluster(visible)) {
    const single = g.members.length === 1;
    const size = Math.round(g.r * 2), col = mix(g.on / g.n);
    const ring = single && g.on > 0 ? `<i class="ring" style="background:${col}"></i>` : '';
    const count = !single && size >= 22 ? `<b>${g.n}</b>` : '';
    const icon = L.divIcon({ className: 'dotm' + (single ? '' : ' merged'), iconSize: [size, size],
      html: `${ring}<i style="background:${col}"></i>${count}` });
    const title = single
      ? `${g.members[0].name}: ${g.on} of ${g.n} heating on`
      : `${g.members.length} areas: ${g.on} of ${g.n} homes heating on. Select to zoom in.`;
    const m = L.marker(map.layerPointToLatLng(g.p), { icon, keyboard: true, title, riseOnHover: true });
    m.on('click', () => single ? onCellClick(g.members[0]) : zoomInto(g));
    dotLayer.addLayer(m);
  }
}
map.on('zoomend', redraw);
showOff.addEventListener('change', redraw);

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<span class="lg-bar" aria-hidden="true"></span><span class="lg-l">All off</span><span class="lg-r">All on</span>';
  return d;
};
legend.addTo(map);

// ---------- Headline ----------
function renderSummary(s, minHomes, local) {
  const v = document.getElementById('verdict');
  if (!s.homes) {
    v.textContent = 'No idea.'; v.className = 'verdict';
    document.getElementById('why').textContent = local
      ? 'Nobody in this part of the map is sharing their heating right now. Zoom out to see more homes.'
      : 'Nobody is sharing their heating yet. Be the first.';
    document.getElementById('bar').style.width = '0';
    document.getElementById('meta').textContent = '';
    return;
  }
  const pct = Math.round(s.heating_on / s.homes * 100);
  v.textContent = pct >= 60 ? 'Yes.' : pct >= 40 ? 'Probably.' : pct >= 20 ? 'Not yet.' : 'No.';
  v.className = 'verdict' + (pct >= 40 ? ' yes' : '');
  const out = s.median_outside_temp != null ? ` It's ${s.median_outside_temp}°C outside for the typical home.` : '';
  document.getElementById('why').textContent =
    `${pct}% of the ${s.homes} ${s.homes === 1 ? 'home' : 'homes'} ${local ? 'in this part of the map' : 'reporting right now'} ${s.homes === 1 ? 'has' : 'have'} ${s.homes === 1 ? 'its' : 'their'} heating on.${out}`;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('meta').textContent =
    'Tap a dot to see the homes in that area.' +
    (minHomes > 1 ? ` Areas with fewer than ${minHomes} homes aren't shown.` : '');
}

// The headline answers for whatever part of the map is in view, not hidden behind the panel.
let DATA = null;
const median = xs => {
  if (!xs.length) return null;
  const a = [...xs].sort((x, y) => x - y), m = a.length >> 1;
  return Math.round((a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2) * 10) / 10;
};
function visibleBounds() {
  const pad = viewPad(), size = map.getSize();
  const b = L.latLngBounds(map.containerPointToLatLng(pad.tl), map.containerPointToLatLng(size.subtract(pad.br)));
  return b.isValid() ? b : map.getBounds();
}
function updateHeadline() {
  if (!DATA) return;
  const b = visibleBounds();
  const inView = DATA.cells.filter(c => b.contains([c.lat, c.lon]));
  if (inView.length === DATA.cells.length) {   // whole country in view: use the national figures
    renderSummary(DATA.summary, DATA.min_homes_per_cell, false);
    return;
  }
  renderSummary({
    homes: inView.reduce((t, c) => t + c.homes, 0),
    heating_on: inView.reduce((t, c) => t + c.heating_on, 0),
    median_outside_temp: median(inView.flatMap(c => c.readings.map(h => h.outdoor_temp)).filter(t => t != null)),
  }, DATA.min_homes_per_cell, true);
}
map.on('moveend', updateHeadline);

// ---------- Feed the dots ----------
function renderCells(cells) {
  CELLS = cells.map(c => { const name = nearestTown(c.lat, c.lon); return { lat: c.lat, lon: c.lon, n: c.homes, on: c.heating_on, name, ref: c }; });
  onCellClick = c => openCell(c.ref, c.name);
  redraw();
}

// ---------- Sheet ----------
const sheet = document.getElementById('sheet'), body = document.getElementById('sheetBody');
function openCell(c, label) {
  body.innerHTML = `
    <h2>${esc(label)}</h2>
    <p class="sub">${c.heating_on} of ${c.homes} homes in this 5 km area have the heating on</p>
    <div class="outside"><b>${fmt(c.outside_temp)}</b><span>outside, middle reading from these homes</span></div>
    ${c.readings.map((h, i) => `
      <div class="home">
        <span class="dot ${h.heating_on ? 'on' : ''}" aria-hidden="true"></span>
        <span class="state">Home ${i + 1}: heating ${h.heating_on ? 'on' : 'off'}</span>
        <span class="src">${esc(SOURCE[h.source] || h.source)}</span>
        <span class="temps">Indoor ${fmt(h.indoor_temp)} · set to ${fmt(h.target_temp)} · outside ${fmt(h.outdoor_temp)} · updated ${h.minutes_ago < 1 ? 'just now' : h.minutes_ago + ' min ago'}</span>
      </div>`).join('')}
    <p class="note" style="margin-top:14px">Locations are rounded to a 5 km grid. Exact addresses are never stored or shown.</p>`;
  sheet.classList.add('open'); sheet.scrollTop = 0;
}
function openConnect() {
  body.innerHTML = `
    <h2>Share your heating</h2>
    <p class="sub">Add your home to the map. Only a rough area and your heating readings are shared.</p>
    <h3>Home Assistant</h3>
    <ol><li>In HACS, add <a href="https://github.com/06benste/shouldiputtheheatingon" target="_blank" rel="noopener">this site's integration repository</a> and install <b>Should I put the heating on?</b></li>
      <li>Restart Home Assistant, then go to Settings, Devices &amp; services, Add integration.</li>
      <li>Pick your thermostat and an outdoor temperature sensor, plus an optional indoor sensor.</li></ol>
    <h3>Hive</h3>
    <p>Add Hive to Home Assistant with its built-in Hive integration, then share its thermostat using the steps above.</p>
    <h3>What gets shared</h3>
    <p>Heating on or off, target temperature, indoor temperature, and the reading from your outdoor sensor. Your location is rounded to a 5 km square inside Home Assistant before anything is sent.</p>
    <h3>Stop sharing</h3>
    <p>Delete the integration in Home Assistant. Your home is removed from this site straight away.</p>
    <p class="note"><a href="https://github.com/06benste/shouldiputtheheatingon" target="_blank" rel="noopener">Source code on GitHub</a></p>`;
  sheet.classList.add('open'); sheet.scrollTop = 0;
}
document.getElementById('connectBtn').addEventListener('click', openConnect);
document.getElementById('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet.classList.remove('open'); });
map.on('click', () => sheet.classList.remove('open'));

// ---------- Load ----------
async function load() {
  try {
    const r = await fetch(API + '/api/v1/cells', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    renderCells(DATA.cells);
    updateHeadline();
  } catch (e) {
    document.getElementById('meta').textContent = "Couldn't load the latest readings. Retrying in a minute.";
  }
}
load();
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
</script>
</body>
</html>

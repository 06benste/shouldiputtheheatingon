<style>
:root{
  --sea:#d7e4ec; --land:#f3f4ef; --coast:#b9c8d2; --ink:#1c2b36; --muted:#5d6d78;
  --hot:#e0322b; --cold:#2f6fdb; --hot-glow:rgba(224,50,43,.28); --off:#8d9ba5; --panel:#ffffff; --line:#dfe5e9;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sea:#0f1b24; --land:#1e2c36; --coast:#2d4150; --ink:#eef2f4; --muted:#9fb0bb; --off:#6e7f8a; --panel:#17232c; --line:#2a3a46; --hot-glow:rgba(255,70,60,.35); }
}
:root[data-theme="dark"]{ --sea:#0f1b24; --land:#1e2c36; --coast:#2d4150; --ink:#eef2f4; --muted:#9fb0bb; --off:#6e7f8a; --panel:#17232c; --line:#2a3a46; --hot-glow:rgba(255,70,60,.35); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--body)}

.answer{position:absolute;z-index:500;left:16px;top:calc(16px + env(safe-area-inset-top,0px));max-width:360px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;box-shadow:0 10px 30px -18px rgba(20,40,60,.5)}
.answer h1{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 2px;color:var(--muted);letter-spacing:.01em}
.verdict{font-family:var(--display);font-weight:800;font-size:clamp(44px,11vw,64px);line-height:.95;margin:0;letter-spacing:-.02em}
.verdict.yes{color:var(--hot)}
.why{margin:10px 0 0;font-size:15px;color:var(--ink);max-width:34ch}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:14px 0 6px;background:var(--cold)}
.meter span{background:var(--hot)}
.meta{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
label.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}

.sheet{position:absolute;z-index:600;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 32px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 10px 30px -18px rgba(20,40,60,.5);display:none}
.sheet.open{display:block}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px;line-height:1.1}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.close{position:absolute;right:12px;top:12px;border:none;font-size:22px;line-height:1;padding:6px 10px}
.outside{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.outside b{font-family:var(--display);font-size:36px;font-weight:800}
.outside span{color:var(--muted);font-size:14px}
.home{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.home:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cold)}
.dot.on{background:var(--hot);box-shadow:0 0 0 4px var(--hot-glow)}
.home .state{font-weight:700}
.home .temps{grid-column:2/4;font-size:14px;color:var(--muted)}
.home .src{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.sheet h3{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.sheet p,.sheet li{font-size:14px}
.sheet ol{padding-left:20px;margin:6px 0}
code{font-size:13px;background:var(--line);padding:1px 5px;border-radius:5px}
.note{font-size:13px;color:var(--muted)}
.sheet a{color:var(--ink)}
.note a{color:var(--muted)}

.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:transparent!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.4);opacity:0}}
.dotm i{position:absolute;inset:0;border-radius:50%}
.dotm.merged i{box-shadow:0 0 0 2px var(--panel)}
.dotm i.ring{animation:pulse 2.6s ease-out infinite;box-shadow:none}
.dotm b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 12px/1 var(--body);text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.dotm i.ring{animation:none;display:none}}
.place-label{display:block;color:var(--muted);font:600 11px/1 var(--body);white-space:nowrap;pointer-events:none;transform:translate(4px,-50%);text-shadow:0 1px 2px var(--panel),0 -1px 2px var(--panel),1px 0 2px var(--panel),-1px 0 2px var(--panel)}
.legend{display:grid;grid-template-columns:auto auto;gap:4px 24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted);min-width:140px}
.lg-bar{grid-column:1/3;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--hot))}
.lg-r{text-align:right}

@media (max-width:720px){
  .legend{margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}
  .answer{left:10px;right:10px;max-width:none;padding:14px 16px}
  .why{max-width:none}
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom,0px)}
}
</style>

function nearestTown(lat, lon) {
  let best = null, bestD = Infinity;
  for (const [n, a, o] of TOWNS) {
    const d = Math.hypot(lat - a, (lon - o) * Math.cos(lat * Math.PI / 180));
    if (d < bestD) { bestD = d; best = n; }
  }
  return bestD < 0.35 ? 'Near ' + best : 'This area';
}

// ---------- Dots, with merging when they overlap ----------
// Colour runs from blue (every home off) to red (every home on).
const COLD = [47, 111, 219], HOT = [224, 50, 43];

const dotSize = homes => Math.round(Math.min(12 + Math.sqrt(homes) * 4, 56));

function mergeGroups(a, b) {
  const n = a.n + b.n;
  return { members: a.members.concat(b.members), n, on: a.on + b.on,
    p: L.point((a.p.x * a.n + b.p.x * b.n) / n, (a.p.y * a.n + b.p.y * b.n) / n), r: dotSize(n) / 2 };
}
function cluster(points) {
  let groups = points.map(c => ({ members: [c], n: c.n, on: c.on, p: map.latLngToLayerPoint([c.lat, c.lon]), r: dotSize(c.n) / 2 }));
  let merged = true;
  while (merged) {                       // keep merging until nothing overlaps
    merged = false;
    groups.sort((a, b) => b.n - a.n);
    for (let i = 0; i < groups.length && !merged; i++) {
      for (let j = i + 1; j < groups.length; j++) {
        if (groups[i].p.distanceTo(groups[j].p) < (groups[i].r + groups[j].r) * 0.9) {
          groups[i] = mergeGroups(groups[i], groups[j]);
          groups.splice(j, 1);
          merged = true; break;
        }
      }
    }
  }
  return groups;
}
function viewPad() {   // the part of the map not covered by the headline panel
  const a = document.querySelector('.answer').getBoundingClientRect();
  return innerWidth < 720 ? { tl: L.point(16, a.bottom + 16), br: L.point(16, 60) }
                          : { tl: L.point(a.right + 16, 24), br: L.point(24, 24) };
}
function zoomInto(g) {
  const b = L.latLngBounds(g.members.map(c => [c.lat, c.lon])), pad = viewPad();
  const z = Math.min(Math.max(map.getBoundsZoom(b.pad(0.3), false, pad.tl.add(pad.br)), map.getZoom() + 1.5), map.getMaxZoom());
  // Put the group in the middle of the uncovered area, not the middle of the screen.
  const shift = pad.tl.subtract(pad.br).divideBy(2);
  map.flyTo(map.unproject(map.project(b.getCenter(), z).subtract(shift), z), z, { duration: 0.5 });
}
function redraw() {
  dotLayer.clearLayers();
  const visible = CELLS.filter(c => showOff.checked || c.on > 0);
  for (const g of cluster(visible)) {
    const single = g.members.length === 1;
    const size = Math.round(g.r * 2), col = mix(g.on / g.n);
    const ring = single && g.on > 0 ? `<i class="ring" style="background:${col}"></i>` : '';
    const count = !single && size >= 22 ? `<b>${g.n}</b>` : '';
    const icon = L.divIcon({ className: 'dotm' + (single ? '' : ' merged'), iconSize: [size, size],
      html: `${ring}<i style="background:${col}"></i>${count}` });
    const title = single
      ? `${g.members[0].name}: ${g.on} of ${g.n} heating on`
      : `${g.members.length} areas: ${g.on} of ${g.n} homes heating on. Select to zoom in.`;
    const m = L.marker(map.layerPointToLatLng(g.p), { icon, keyboard: true, title, riseOnHover: true });
    m.on('click', () => single ? onCellClick(g.members[0]) : zoomInto(g));
    dotLayer.addLayer(m);
  }
}

// ---------- Headline ----------
function renderSummary(s, minHomes) {
  const v = document.getElementById('verdict');
  if (!s.homes) {
    v.textContent = 'No idea.'; v.className = 'verdict';
    document.getElementById('why').textContent = 'Nobody is sharing their heating yet. Be the first.';
    document.getElementById('bar').style.width = '0';
    document.getElementById('meta').textContent = '';
    return;
  }
  const pct = Math.round(s.heating_on / s.homes * 100);
  v.textContent = pct >= 60 ? 'Yes.' : pct >= 40 ? 'Probably.' : pct >= 20 ? 'Not yet.' : 'No.';
  v.className = 'verdict' + (pct >= 40 ? ' yes' : '');
  const out = s.median_outside_temp != null ? ` It's ${s.median_outside_temp}°C outside for the typical home.` : '';
  document.getElementById('why').textContent =
    `${pct}% of the ${s.homes} ${s.homes === 1 ? 'home' : 'homes'} reporting right now have their heating on.${out}`;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('meta').textContent =
    'Tap a dot to see the homes in that area.' +
    (minHomes > 1 ? ` Areas with fewer than ${minHomes} homes aren't shown.` : '');
}

// ---------- Feed the dots ----------
function renderCells(cells) {
  CELLS = cells.map(c => { const name = nearestTown(c.lat, c.lon); return { lat: c.lat, lon: c.lon, n: c.homes, on: c.heating_on, name, ref: c }; });
  onCellClick = c => openCell(c.ref, c.name);
  redraw();
}

document.getElementById('connectBtn').addEventListener('click', openConnect);
document.getElementById('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet.classList.remove('open'); });
map.on('click', () => sheet.classList.remove('open'));

// ---------- Load ----------
async function load() {
  try {
    const r = await fetch(API + '/api/v1/cells', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    renderSummary(data.summary, data.min_homes_per_cell);
    renderCells(data.cells);
  } catch (e) {
    document.getElementById('meta').textContent = "Couldn't load the latest readings. Retrying in a minute.";
  }
}
load();
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
</script>
